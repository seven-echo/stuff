# docker-compose.yml - Docker Compose配置

version: '3.8'

services:
  # 主应用服务
  stock-analyzer:
    build: .
    ports:
      - "8501:8501"
    environment:
      - FLASK_ENV=production
      - OPENBB_API_KEY=${OPENBB_API_KEY:-}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - stock-analyzer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - stock-analyzer-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - stock-analyzer
    restart: unless-stopped
    networks:
      - stock-analyzer-network

  # 数据库服务 (可选，用于用户管理)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=stock_analyzer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - stock-analyzer-network

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  stock-analyzer-network:
    driver: bridge